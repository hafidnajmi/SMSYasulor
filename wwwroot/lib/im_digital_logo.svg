<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="imGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB" />
      <stop offset="100%" stop-color="#032954" />
    </linearGradient>
  </defs>
  <!-- Background subtle square with border -->
  <rect x="15" y="15" width="170" height="170" fill="#FFFFFF" stroke="#032954" stroke-width="4" />
  <rect x="23" y="23" width="154" height="154" fill="none" stroke="#0047AB" stroke-width="1.5" stroke-dasharray="6,4" />
  
  <!-- Digital Nodes & Circuit Traces -->
  <path d="M40 50 H70 M130 50 H160" stroke="#0047AB" stroke-width="3" stroke-linecap="square" />
  <circle cx="40" cy="50" r="4" fill="#0047AB" />
  <circle cx="160" cy="50" r="4" fill="#0047AB" />
  
  <!-- Monogram IM -->
  <text x="100" y="112" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="900" fill="#032954" text-anchor="middle" letter-spacing="2">IM</text>
  
  <!-- Horizontal Accent Divider -->
  <line x1="45" y1="126" x2="155" y2="126" stroke="#0047AB" stroke-width="3" />
  
  <!-- Text DIGITAL -->
  <text x="100" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#0047AB" text-anchor="middle" letter-spacing="4">DIGITAL</text>
</svg>

