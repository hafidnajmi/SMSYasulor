# ============================================================================
#  config.yaml  —  Sparepart Management System (SMS / UPMS)
#  Konfigurasi utama aplikasi. Edit bagian yang ditandai [WAJIB DIISI].
# ============================================================================

# ----------------------------------------------------------------------------
#  DATABASE  — Koneksi ke SQL Server
#  [WAJIB DIISI sebelum pertama kali menjalankan aplikasi di server baru]
# ----------------------------------------------------------------------------
database:
  active_env: "production"

  production:
    driver: "sqlserver"
    # Ganti "localhost" dengan IP PC Server (contoh: "192.168.1.100") jika diakses dari PC lain / Multi-PC LAN
    host: "localhost"
    port: 1433
    user: ""
    password: ""
    database: "UPMS_Database"

rbac:
  initial_admin:
    username: "admin"
    password: "[PASSWORD]"
    role: "admin"

email:
  enabled: false
  smtp_host: ""         # Contoh: smtp.gmail.com
  smtp_port: 587
  smtp_user: ""         # Email pengirim
  smtp_password: ""     # Password / App Password email
  smtp_use_tls: true

  alert_recipient: ""   # Contoh: manager@perusahaan.com

system:
  app_name: "Sparepart Management System"
  app_version: "4.26.2"
  debug_mode: false
  timezone: "Asia/Jakarta"
